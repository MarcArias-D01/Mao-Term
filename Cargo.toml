[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal (add crates here as they gain real dependents)
mao-config = { path = "crates/mao-config" }
mao-render = { path = "crates/mao-render" }
mao-terminal = { path = "crates/mao-terminal" }

# external
anyhow = "1"
directories = "6"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# wgpu must match the version glyphon depends on (glyphon 0.12 → wgpu 30).
wgpu = "30"
winit = "0.30"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
