[package]
name = "mao-app"
description = "Mao-Term: a fast, modern GPU terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mao-term"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = "3.7.0"
mao-agents.workspace = true
mao-complete.workspace = true
mao-config.workspace = true
mao-docs.workspace = true
mao-fs.workspace = true
mao-input.workspace = true
mao-render.workspace = true
mao-sysmon.workspace = true
mao-terminal.workspace = true
mao-ui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width = "0.2.3"
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# Only for DwmExtendFrameIntoClientArea (glass backdrop over the whole window).
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_Foundation"] }

[lints]
workspace = true
