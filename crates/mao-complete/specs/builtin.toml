# Built-in completion specs. Format: docs/specs/input-autocomplete.md.
# args: any (default, offers paths) | path | dir | branch | none

[[spec]]
name = "cd"
aliases = ["Set-Location", "sl", "chdir", "pushd", "z"]
description = "Change directory"
args = "dir"

[[spec]]
name = "code"
description = "Open in VS Code"
args = "path"

# ───────────────────────── git ─────────────────────────
[[spec]]
name = "git"
description = "Version control"
args = "none"

[[spec.option]]
names = ["--version"]
description = "Print the git version"

[[spec.option]]
names = ["-C"]
description = "Run as if started in <path>"

[[spec.sub]]
name = "status"
description = "Show the working tree status"
args = "path"
[[spec.sub.option]]
names = ["-s", "--short"]
description = "Short format"
[[spec.sub.option]]
names = ["-b", "--branch"]
description = "Show branch info"

[[spec.sub]]
name = "add"
description = "Add file contents to the index"
args = "path"
[[spec.sub.option]]
names = ["-A", "--all"]
description = "Add all changes"
[[spec.sub.option]]
names = ["-p", "--patch"]
description = "Choose hunks interactively"

[[spec.sub]]
name = "commit"
description = "Record changes to the repository"
args = "path"
[[spec.sub.option]]
names = ["-m", "--message"]
description = "Commit message"
[[spec.sub.option]]
names = ["-a", "--all"]
description = "Stage modified and deleted files"
[[spec.sub.option]]
names = ["--amend"]
description = "Amend the previous commit"

[[spec.sub]]
name = "checkout"
description = "Switch branches or restore files"
args = "branch"
[[spec.sub.option]]
names = ["-b"]
description = "Create and switch to a new branch"

[[spec.sub]]
name = "switch"
description = "Switch branches"
args = "branch"
[[spec.sub.option]]
names = ["-c", "--create"]
description = "Create a new branch"

[[spec.sub]]
name = "branch"
description = "List, create or delete branches"
args = "branch"
[[spec.sub.option]]
names = ["-d", "--delete"]
description = "Delete a branch"
[[spec.sub.option]]
names = ["-a", "--all"]
description = "List local and remote branches"

[[spec.sub]]
name = "merge"
description = "Join histories together"
args = "branch"

[[spec.sub]]
name = "rebase"
description = "Reapply commits on top of another base"
args = "branch"
[[spec.sub.option]]
names = ["-i", "--interactive"]
description = "Interactive rebase"
[[spec.sub.option]]
names = ["--continue"]
description = "Continue after resolving conflicts"
[[spec.sub.option]]
names = ["--abort"]
description = "Abort the rebase"

[[spec.sub]]
name = "pull"
description = "Fetch and integrate"
args = "none"
[[spec.sub.option]]
names = ["--rebase"]
description = "Rebase instead of merge"

[[spec.sub]]
name = "push"
description = "Update remote refs"
args = "branch"
[[spec.sub.option]]
names = ["-u", "--set-upstream"]
description = "Set upstream"
[[spec.sub.option]]
names = ["--force-with-lease"]
description = "Force push safely"

[[spec.sub]]
name = "fetch"
description = "Download objects and refs"
args = "none"
[[spec.sub.option]]
names = ["--all"]
description = "Fetch all remotes"
[[spec.sub.option]]
names = ["-p", "--prune"]
description = "Prune deleted remote branches"

[[spec.sub]]
name = "log"
description = "Show commit logs"
args = "branch"
[[spec.sub.option]]
names = ["--oneline"]
description = "One line per commit"
[[spec.sub.option]]
names = ["--graph"]
description = "Draw the history graph"

[[spec.sub]]
name = "diff"
description = "Show changes"
args = "path"
[[spec.sub.option]]
names = ["--staged", "--cached"]
description = "Changes in the index"

[[spec.sub]]
name = "restore"
description = "Restore working tree files"
args = "path"
[[spec.sub.option]]
names = ["--staged"]
description = "Unstage"

[[spec.sub]]
name = "reset"
description = "Reset HEAD to a state"
args = "branch"
[[spec.sub.option]]
names = ["--hard"]
description = "Discard working tree changes"
[[spec.sub.option]]
names = ["--soft"]
description = "Keep changes staged"

[[spec.sub]]
name = "stash"
description = "Stash changes"
args = "none"
[[spec.sub.sub]]
name = "pop"
description = "Apply and drop the latest stash"
[[spec.sub.sub]]
name = "list"
description = "List stashes"
[[spec.sub.sub]]
name = "apply"
description = "Apply a stash"

[[spec.sub]]
name = "clone"
description = "Clone a repository"
args = "none"

[[spec.sub]]
name = "init"
description = "Create an empty repository"
args = "dir"

[[spec.sub]]
name = "remote"
description = "Manage remotes"
args = "none"
[[spec.sub.option]]
names = ["-v", "--verbose"]
description = "Show URLs"

[[spec.sub]]
name = "tag"
description = "Manage tags"
args = "none"

[[spec.sub]]
name = "cherry-pick"
description = "Apply commits from elsewhere"
args = "branch"

[[spec.sub]]
name = "show"
description = "Show objects"
args = "branch"

